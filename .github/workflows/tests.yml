# Run ./test.sh (all stages, extensive mode) and publish the report.
# Supply chain: no imported actions (no `uses:`); only shell steps on the GitHub runner image.
# pixi binary checked by SHA-256; Python packages from the Anaconda main channel through pixi.lock;
# system tools from Ubuntu apt. Reports go to the `ci-reports` branch through plain git.
name: tests

on:
  push:
    branches: [autotests]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # push reports/ to the ci-reports branch

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIXI_VERSION: "0.81.0"
      PIXI_SHA256: "248510f5f75460a2ae4ec62d761e15c0191dc35db3b1da6f82d9f17c6017051d"
    steps:
      - name: Check out the commit (plain git)
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Install system tools (time, strace, perf)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q time strace
          # perf must match the runner kernel; the profile stage works without it, but has no flame graph.
          sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)" || echo "::warning::perf is not available for kernel $(uname -r)"
          sudo sysctl -w kernel.perf_event_paranoid=2

      - name: Install pixi (SHA-256 checked)
        run: |
          curl -fsSL -o pixi "https://github.com/prefix-dev/pixi/releases/download/v${PIXI_VERSION}/pixi-x86_64-unknown-linux-musl"
          echo "${PIXI_SHA256}  pixi" | sha256sum -c -
          install -m 755 pixi "$HOME/.local/bin/pixi" -D
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run all tests (./test.sh)
        run: ./test.sh 2>&1 | tee test-sh.log || true   # failures are reported below, not fatal

      - name: Write job summary
        if: always()
        run: pixi run python tests/ci_summary.py test-sh.log >> "$GITHUB_STEP_SUMMARY"

      - name: Publish reports to the ci-reports branch (plain git)
        if: always() && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: |
          # One orphan commit per run, force-pushed: the branch never collects history.
          out="$RUNNER_TEMP/ci-reports"
          mkdir -p "$out" && cp -r reports test-sh.log "$out"/
          find "$out" -name '*.perf.data*' -delete
          cd "$out"
          git init -q -b ci-reports .
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
              commit -q -m "Reports for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -q --force \
              "https://x-access-token:${TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" HEAD:ci-reports
          echo "Reports: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/ci-reports" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failed tests (known defects do not fail the job)
        if: always()
        run: |
          # Test failures are reported as warnings; DEFECTS.md lists them as known problems.
          # The job fails only if test.sh did not finish (no stage summary), which is a harness problem.
          grep '^FAIL  ' test-sh.log | sed 's/^FAIL  /::warning title=Failed stage::/' || true
          grep -h -E '^(FAIL|ERROR): ' reports/*python.log | sort -u | sed 's/^/::warning title=Failing test::/' || true
          grep -q -E '^(PASS|FAIL)  profile$' test-sh.log || { echo "::error::test.sh did not finish"; exit 1; }
