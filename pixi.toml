[workspace]
name = "titan-learned-tests"
version = "0.1.0"
channels = ["https://repo.anaconda.com/pkgs/main"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
hypothesis = ">=6,<7"
pyyaml = ">=6,<7"

[tasks]
check = "python tests/campaign.py check"
benchmark = "python tests/campaign.py benchmark"
mutation = "python tests/campaign.py mutation"
profile = "python tests/campaign.py profile"
status = "python tests/campaign.py status"
stop = "python tests/campaign.py stop"
